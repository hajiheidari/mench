name: native-development-builds
on: workflow_dispatch
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run check
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - run: python ../../../infra/scripts/verify-gradle-wrapper.py gradle/wrapper/gradle-wrapper.properties
        working-directory: apps/mobile/android
      - run: ./gradlew app:assembleRelease --no-daemon --max-workers=4 -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-development-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx expo prebuild --platform ios
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
      - run: xcodebuild -workspace Mench.xcworkspace -scheme Mench -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile/ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-development-app
          path: apps/mobile/ios/build/Build/Products/Debug-iphonesimulator/*.app
