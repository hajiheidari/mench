# Sets up Game Center in App Store Connect (leaderboard, achievements, images)
# through the API: infra/scripts/asc_gamecenter.py with
# apps/mobile/store/gamecenter/. Safe to re-run; it never submits anything.
name: gamecenter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyjwt==2.10.1 cryptography==45.0.7 requests==2.32.5
      - name: App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 infra/scripts/write-asc-key.py "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
      - run: python3 infra/scripts/asc_gamecenter.py
