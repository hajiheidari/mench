# iOS build. Run: Actions → ios → Run workflow.
# Without secrets it compiles an unsigned Release archive (a check that the
# app builds). With these repository secrets it signs with Apple's
# cloud-managed certificate and uploads to App Store Connect (TestFlight):
#   APPLE_TEAM_ID   Team ID (developer.apple.com → Account → Membership)
#   ASC_KEY_ID      App Store Connect API key id (role: Admin)
#   ASC_ISSUER_ID   the keys page's Issuer ID
#   ASC_KEY_P8      the downloaded AuthKey_XXXX.p8, whole text
# and an app record with bundle id com.espadna.mench in App Store Connect.
name: ios

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (off = only build and sign)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  appstore:
    # Expo SDK 57 / React Native 0.86 need Xcode 26 (Swift 6.2).
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_BACKEND: edge
      NODE_ENV: production
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Secrets present
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Signing: OFF (missing:$missing)"
            echo "::warning::Missing repository secrets:$missing (docs/RELEASE.md). Building an unsigned archive only."
            echo "HAVE_SECRETS=false" >> "$GITHUB_ENV"
          else
            echo "Signing: ON (App Store Connect API key found)"
            echo "HAVE_SECRETS=true" >> "$GITHUB_ENV"
          fi
      - name: Newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx expo prebuild --platform ios
        working-directory: apps/mobile
        env:
          CI: "1"
      - name: Archive
        working-directory: apps/mobile/ios
        run: |
          if [ "$HAVE_SECRETS" = true ]; then
            # Pasted IDs often carry stray spaces or newlines.
            for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
              clean=$(printf '%s' "${!v}" | tr -d '[:space:]"')
              export "$v=$clean"
              echo "$v=$clean" >> "$GITHUB_ENV"
            done
            mkdir -p "$RUNNER_TEMP/keys"
            python3 ../../../infra/scripts/write-asc-key.py "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
            openssl pkey -in "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" -noout \
              || { echo "::error::ASC_KEY_P8 is not a valid private key. Paste the full AuthKey_$ASC_KEY_ID.p8 text."; exit 1; }
          fi
          # Unsigned archive; the export below signs it with Apple's
          # cloud-managed distribution certificate (no certificate files here).
          # The Xcode project is named after the app (expo.name), e.g. VIPLudo.
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme=${workspace%.xcworkspace}
          echo "Workspace: $workspace, scheme: $scheme"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" ${APPLE_TEAM_ID:+DEVELOPMENT_TEAM="$APPLE_TEAM_ID"} \
            CODE_SIGNING_ALLOWED=NO -quiet archive
          test -d "$RUNNER_TEMP/App.xcarchive"
      - name: Export and upload
        if: env.HAVE_SECRETS == 'true'
        run: |
          destination=export
          [ "${{ inputs.upload }}" = true ] && destination=upload
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        if: env.HAVE_SECRETS == 'true' && !inputs.upload
        with:
          name: mench-ios
          path: ${{ runner.temp }}/export/*.ipa
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
