services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports: ["127.0.0.1:3001:3001"]
    environment:
      DATABASE_URL: postgres://mench:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/mench
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: npm run dev:web
    ports: ["127.0.0.1:5173:5173"]
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: mench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: mench
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mench -d mench"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-bookworm
    profiles: [data]
    ports: ["127.0.0.1:6379:6379"]
volumes:
  postgres-data:
